<!-- ... existing code ... -->
    // =========================================================================
    // DOWNLOAD PDF LANGSUNG (html2pdf.js + FALLBACK PRINT-TO-PDF)
    // =========================================================================
    function setPdfButtonsLoading(loading) {
      document.querySelectorAll('.btn-download-pdf').forEach(btn => {
        btn.disabled = loading;
        if (loading) {
          btn.classList.add('opacity-75', 'cursor-wait');
          btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Membuat PDF...</span>`;
        } else {
          btn.classList.remove('opacity-75', 'cursor-wait');
          btn.innerHTML = `<i data-lucide="file-down" class="w-4 h-4"></i><span>Download PDF</span>`;
        }
        lucide.createIcons({ nodes: [btn] });
      });
    }

    function sanitizeFilenamePart(str) {
      return (str || 'Umum')
        .replace(/[^a-zA-Z0-9\s-_]/g, '')
        .trim()
        .replace(/\s+/g, '-')
        .slice(0, 40) || 'Umum';
    }

    async function downloadReceiptPDF() {
      if (isExportingPdf) return;
      renderPreview();

      // Fallback otomatis jika library html2pdf tidak termuat (misal offline / sandbox memblokir CDN)
      if (typeof window.html2pdf === 'undefined') {
        showToast('Library PDF tidak tersedia. Gunakan Print lalu pilih "Save as PDF / Simpan sebagai PDF".', 'info');
        setTimeout(() => triggerPrintReceipt(), 400);
        return;
      }

      isExportingPdf = true;
      setPdfButtonsLoading(true);

      const notaEl = document.getElementById('printable-nota');
      const prevZoom = previewZoom;

      try {
        // Normalisasi skala zoom & gaya kertas sementara agar hasil PDF tajam dan tidak terpotong
        notaEl.style.transform = 'none';
        notaEl.classList.add('pdf-export-mode');

        const invNo = sanitizeFilenamePart(document.getElementById('inv-number').value || 'NP');
        const cust = sanitizeFilenamePart(document.getElementById('cust-name').value || 'Pelanggan');
        const filename = `Nota-${invNo}-${cust}.pdf`;

        let jsPdfConfig = { unit: 'mm', format: 'a4', orientation: 'portrait' };
        let html2canvasWidth = 794; // 210mm pada 96dpi

        if (currentFormat === 'a5') {
          jsPdfConfig = { unit: 'mm', format: 'a5', orientation: 'portrait' };
          html2canvasWidth = 559; // 148mm pada 96dpi
        } else if (currentFormat === 'struk80') {
          // Hitung tinggi konten dinamis untuk struk thermal 80mm
          const measuredPxHeight = Math.max(420, notaEl.scrollHeight + 24);
          const heightMm = Math.ceil((measuredPxHeight * 80) / 302);
          jsPdfConfig = { unit: 'mm', format: [80, heightMm], orientation: 'portrait' };
          html2canvasWidth = 302; // 80mm pada 96dpi
        }

        const opt = {
          margin: 0,
          filename,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2.5,
            useCORS: true,
            backgroundColor: '#ffffff',
            scrollX: 0,
            scrollY: 0,
            windowWidth: html2canvasWidth
          },
          jsPDF: jsPdfConfig,
          pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.avoid-break'] }
        };

        await window.html2pdf().set(opt).from(notaEl).save();

    function computeBannerMetrics() {
      const pRaw = parseFloat(document.getElementById('bn-p').value) || 0;
      const lRaw = parseFloat(document.getElementById('bn-l').value) || 0;
      const qty = Math.max(1, parseInt(document.getElementById('bn-qty').value, 10) || 1);
      const rate = Math.max(0, parseFloat(document.getElementById('bn-rate').value) || 0);
      const min1 = document.getElementById('bn-min1').checked;

      const pMeter = bannerUnit === 'cm' ? pRaw / 100 : pRaw;
      const lMeter = bannerUnit === 'cm' ? lRaw / 100 : lRaw;
      const rawArea = Math.max(0, pMeter * lMeter);
      let area = rawArea > 0 ? Math.round(rawArea * 100) / 100 : 0;
      if (area > 0 && min1 && area < 1) {
        area = 1;
      }
      const unitPrice = Math.round(area * rate);
      const subtotal = unitPrice * qty;

      return { pRaw, lRaw, area, qty, rate, unitPrice, subtotal };
    }
